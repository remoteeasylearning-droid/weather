.wrap{max-width:1080px;margin:0 auto;padding:20px 12px 40px}
header{text-align:center;padding:10px 0 14px}
h1{font-family:'Marck Script','Segoe Script',cursive;font-size:clamp(2.2rem,6vw,3.6rem);margin:0;color:#7a3410;text-shadow:0 2px 0 rgba(255,255,255,.7)}
.who{display:inline-flex;gap:8px;align-items:center;margin-top:6px;background:var(--paper);padding:6px 14px;border-radius:30px;font-weight:600}
.who input{border:0;border-bottom:2px dashed var(--gold);background:transparent;font:inherit;color:var(--ink);width:min(220px,50vw);padding:2px 4px}
.who input:focus{outline:none;border-bottom-style:solid}
.panel{background:var(--paper);border-radius:18px;box-shadow:0 6px 24px rgba(90,50,10,.18);padding:14px;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:center}
.stat b{display:block;font-size:1.5rem;color:var(--leaf)}
.stat span{font-size:.85rem;color:var(--muted)}
.bar{height:14px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--leaf));transition:width .4s}
.tbl{padding:0;overflow:hidden}
.hd,.row{display:grid;grid-template-columns:88px 1.15fr 1.15fr 1fr 96px 1.4fr;gap:8px;align-items:center;padding:7px 12px}
.hd{background:linear-gradient(#e9a23b,#d98a24);color:#fff;font-weight:800;position:sticky;top:env(safe-area-inset-top,0px);z-index:2;text-align:center}
.row{border-top:1px solid var(--line)}
.row.wk{background:var(--wk)}
.row.today{background:var(--today);box-shadow:inset 5px 0 0 var(--leaf)}
.row.done .d{color:#2f7d32}
.d{font-weight:800;line-height:1.15}
.d small{display:block;font-weight:600;color:var(--muted);font-size:.78rem}
.d em{font-style:normal;font-size:.7rem;background:var(--leaf);color:#fff;border-radius:8px;padding:1px 6px;margin-left:4px}
select,input.t,input.n{width:100%;font:inherit;font-size:.95rem;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:10px;padding:7px 6px;min-height:40px}
select:focus,input:focus{outline:3px solid #f5b94d;outline-offset:1px;border-color:var(--gold)}
input.t{text-align:center}
.lab{display:none;font-size:.75rem;font-weight:800;color:var(--muted);margin-bottom:2px}
.tools{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:6px}
button{font:inherit;font-weight:700;border:0;border-radius:24px;padding:10px 18px;cursor:pointer;background:var(--leaf);color:#fff;min-height:44px}
button.g{background:#fff;color:var(--ink);border:2px solid var(--line)}
button:focus-visible{outline:3px solid #f5b94d;outline-offset:2px}
.saved{text-align:center;font-size:.85rem;color:var(--ink);background:var(--paper);display:table;margin:10px auto 0;padding:4px 14px;border-radius:20px}
@media(max-width:760px){
.hd{display:none}
.row{grid-template-columns:1fr 1fr;padding:12px;gap:8px 10px}
.row .d{grid-column:1/-1;font-size:1.05rem}
.row .d small{display:inline;margin-left:6px}
.row .n{grid-column:1/-1}
.lab{display:block}
}
@media(prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>🍂 Мій календар погоди · жовтень 2026</h1>
<div class="who"><label for="name">Спостерігач:</label><input id="name" placeholder="Напиши своє ім’я" maxlength="40" autocomplete="off"></div>
</header>

<div class="panel stats">
<div class="stat"><b id="sDone">0 / 31</b><span>днів записано</span><div class="bar"><i id="bar"></i></div></div>
<div class="stat"><b id="sAvg">—</b><span>середня температура</span></div>
<div class="stat"><b id="sMax">—</b><span>найтепліше</span></div>
<div class="stat"><b id="sMin">—</b><span>найхолодніше</span></div>
<div class="stat"><b id="sRain">0</b><span>днів з опадами</span></div>
</div>

<div class="panel tbl" id="tbl">
<div class="hd"><div>Дата</div><div>Стан неба</div><div>Опади</div><div>Вітер</div><div>t, °C</div><div>Примітка</div></div>
<div id="rows"></div>
</div>

<div class="tools">
<button class="g" id="toToday">Перейти до сьогодні</button>
<button class="g" id="clear">Очистити все</button>
</div>
<div class="saved" id="saved">Записи зберігаються автоматично на цьому пристрої</div>
</div>

<script>
(function(){
var YEAR=2026,MONTH=9,KEY='weather-calendar-oct-2026';
var DAYS=['неділя','понеділок','вівторок','середа','четвер','пʼятниця','субота'];
var OPT={
sky:['☀️ Ясно','🌤️ Мінлива хмарність','⛅ Хмарно з проясненнями','☁️ Похмуро','🌫️ Туман'],
rain:['✅ Без опадів','🌦️ Мряка','🌧️ Дощ','🌨️ Мокрий сніг','❄️ Сніг','⛈️ Гроза','🧊 Град'],
wind:['🍃 Безвітряно','🌬️ Слабкий','💨 Помірний','🌪️ Сильний']
};
var data={name:'',days:{}};
try{var raw=localStorage.getItem(KEY);if(raw)data=JSON.parse(raw)||data;if(!data.days)data.days={};}catch(e){}
var now=new Date(),todayN=(now.getFullYear()===YEAR&&now.getMonth()===MONTH)?now.getDate():(now>new Date(YEAR,MONTH+1,0)?32:0);
var rowsEl=document.getElementById('rows'),saveTimer;

function sel(key,list,d){
var s=document.createElement('select');s.dataset.k=key;s.dataset.d=d;s.setAttribute('aria-label',key+' '+d);
var o=document.createElement('option');o.value='';o.textContent='— обери —';s.appendChild(o);
list.forEach(function(t){var x=document.createElement('option');x.value=t;x.textContent=t;s.appendChild(x)});
return s}
function wrap(label,el,cls){var w=document.createElement('div');if(cls)w.className=cls;var l=document.createElement('div');l.className='lab';l.textContent=label;w.appendChild(l);w.appendChild(el);return w}

for(var d=1;d<=31;d++){
var dt=new Date(YEAR,MONTH,d),wd=dt.getDay();
var r=document.createElement('div');r.className='row'+((wd===0||wd===6)?' wk':'')+(d===todayN?' today':'');r.dataset.d=d;
var c=document.createElement('div');c.className='d';c.innerHTML=d+' жовтня'+(d===todayN?' <em>сьогодні</em>':'')+'<small>'+DAYS[wd]+'</small>';
r.appendChild(c);
r.appendChild(wrap('Стан неба',sel('sky',OPT.sky,d)));
r.appendChild(wrap('Опади',sel('rain',OPT.rain,d)));
r.appendChild(wrap('Вітер',sel('wind',OPT.wind,d)));
var t=document.createElement('input');t.type='number';t.inputMode='numeric';t.min=-40;t.max=45;t.step=1;t.className='t';t.dataset.k='temp';t.dataset.d=d;t.placeholder='°C';t.setAttribute('aria-label','Температура '+d);
r.appendChild(wrap('Температура, °C',t));
var n=document.createElement('input');n.type='text';n.className='t';n.style.textAlign='left';n.dataset.k='note';n.dataset.d=d;n.maxLength=120;n.placeholder='Що помітив(ла)?';n.setAttribute('aria-label','Примітка '+d);
r.appendChild(wrap('Примітка',n,'n'));
rowsEl.appendChild(r);
var v=data.days[d]||{};
r.querySelectorAll('[data-k]').forEach(function(e){if(v[e.dataset.k]!==undefined)e.value=v[e.dataset.k]});
}
document.getElementById('name').value=data.name||'';

function persist(){
try{localStorage.setItem(KEY,JSON.stringify(data));flash('Збережено ✓')}catch(e){flash('Не вдалося зберегти на цьому пристрої')}}
function flash(t){var s=document.getElementById('saved');s.textContent=t;clearTimeout(saveTimer);saveTimer=setTimeout(function(){s.textContent='Записи зберігаються автоматично на цьому пристрої'},1800)}

function stats(){
var done=0,temps=[],rain=0;
for(var d=1;d<=31;d++){
var v=data.days[d]||{},row=rowsEl.children[d-1];
var full=v.sky&&v.rain&&v.wind&&v.temp!==undefined&&v.temp!=='';
if(full)done++;row.classList.toggle('done',!!full);
if(v.temp!==undefined&&v.temp!==''&&!isNaN(+v.temp))temps.push(+v.temp);
if(v.rain&&v.rain.indexOf('Без')<0)rain++;
}
document.getElementById('sDone').textContent=done+' / 31';
document.getElementById('bar').style.width=(done/31*100)+'%';
document.getElementById('sRain').textContent=rain;
if(temps.length){
var sum=temps.reduce(function(a,b){return a+b},0)/temps.length;
document.getElementById('sAvg').textContent=(Math.round(sum*10)/10).toString().replace('.',',')+' °C';
document.getElementById('sMax').textContent=Math.max.apply(null,temps)+' °C';
document.getElementById('sMin').textContent=Math.min.apply(null,temps)+' °C';
}else{['sAvg','sMax','sMin'].forEach(function(i){document.getElementById(i).textContent='—'})}
}

function onEdit(e){
var el=e.target,k=el.dataset.k;if(!k)return;
var d=el.dataset.d;data.days[d]=data.days[d]||{};data.days[d][k]=el.value;persist();stats();}
rowsEl.addEventListener('input',onEdit);rowsEl.addEventListener('change',onEdit);
document.getElementById('name').addEventListener('input',function(e){data.name=e.target.value;persist()});

document.getElementById('toToday').addEventListener('click',function(){
var d=todayN>=1&&todayN<=31?todayN:(todayN===32?31:1);
rowsEl.children[d-1].scrollIntoView({behavior:'smooth',block:'center'})});
document.getElementById('clear').addEventListener('click',function(){
if(!confirm('Очистити всі записи за жовтень? Це не можна скасувати.'))return;
data.days={};rowsEl.querySelectorAll('[data-k]').forEach(function(e){e.value=''});persist();stats()});

stats();
if(todayN>=1&&todayN<=31)setTimeout(function(){rowsEl.children[todayN-1].scrollIntoView({block:'center'})},300);
})();
</script>
</body>
</html>
